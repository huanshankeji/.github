name: Gradle Maven publish

on:
  workflow_call:
    inputs:
      jdk-versions:
        description: "Comma-separated JDK versions passed to setup-javas"
        required: true
        type: string
      runs-on:
        description: "Runner label"
        required: true
        type: string

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
    env:
      ORG_GRADLE_PROJECT_gprUser: ${{ secrets.GPR_USER }}
      ORG_GRADLE_PROJECT_gprKey: ${{ secrets.GPR_KEY }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDKs
        uses: huanshankeji/.github/actions/setup-javas@v0.3.0
        with:
          jdk-versions: ${{ inputs.jdk-versions }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish with Gradle Wrapper
        shell: bash
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          gpr_args=(-PgprUser="$GPR_USER" -PgprKey="$GPR_KEY" -PGitHubPackagesUsername="$GPR_USER" -PGitHubPackagesPassword="$GPR_KEY")
          if [ "${{ github.ref }}" = "refs/heads/release" ]; then
            ./gradlew publishToMavenCentral "${gpr_args[@]}"
          else
            ./gradlew publishAllPublicationsToGitHubPackagesRepository --parallel --no-configuration-cache "${gpr_args[@]}"
          fi
