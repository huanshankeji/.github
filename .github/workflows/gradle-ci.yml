name: Gradle CI

on:
  workflow_call:
    inputs:
      jdk-versions:
        description: "Comma-separated JDK versions passed to setup-javas"
        required: true
        type: string
      runs-on:
        description: "Runner label for both jobs"
        required: true
        type: string

jobs:
  check:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    env:
      ORG_GRADLE_PROJECT_gprUser: ${{ secrets.GPR_USER }}
      ORG_GRADLE_PROJECT_gprKey: ${{ secrets.GPR_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDKs
        uses: huanshankeji/.github/actions/setup-javas@v0.3.0
        with:
          jdk-versions: ${{ inputs.jdk-versions }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check with Gradle Wrapper
        shell: bash
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: ./gradlew check -PgprUser="$GPR_USER" -PgprKey="$GPR_KEY"

  dependency-submission:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_gprUser: ${{ secrets.GPR_USER }}
      ORG_GRADLE_PROJECT_gprKey: ${{ secrets.GPR_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDKs
        uses: huanshankeji/.github/actions/setup-javas@v0.3.0
        with:
          jdk-versions: ${{ inputs.jdk-versions }}

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
