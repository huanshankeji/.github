name: Gradle check
description: >
  Deprecated — prefer inlining checkout, setup-javas, setup-gradle, and `./gradlew check`
  in reusable workflows so extra setup steps (e.g. Android SDK) can be inserted.
  Kept for backward compatibility with existing workflow references.

inputs:
  jdk-versions:
    description: "Comma-separated JDK versions and distributions passed to setup-javas"
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Set up JDKs
      uses: huanshankeji/.github/actions/setup-javas@v0.4.0
      with:
        jdk-versions: ${{ inputs.jdk-versions }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Consider removing this reverting coomit 88f302c822163b421452d37945486c3b2a2ac54b as it seems only a JVM project and a multiplatform project with the Android target have this `test` task
    - name: Test with Gradle Wrapper
      shell: bash
      run: ./gradlew test

    - name: Check with Gradle Wrapper
      shell: bash
      run: ./gradlew check
