name: Dependency submission
description: Generate and submit dependency graph

inputs:
  jdk-versions:
    description: "Comma-separated list of JDK versions and distributions (supported ones: \"8-zulu\", \"8-temurin\", \"11-temurin\", \"17-temurin\", \"21-temurin\", and \"25-temurin\")"
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - name: Set up JDKs
      uses: huanshankeji/.github/actions/setup-javas@v0.3.0
      with:
        jdk-versions: ${{ inputs.jdk-versions }}

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v6
