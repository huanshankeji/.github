name: Dependency submission
description: >
  Deprecated — prefer inlining checkout, setup-javas, and dependency-submission
  in reusable workflows so extra setup steps can be inserted per job.
  Kept for backward compatibility with existing workflow references.

inputs:
  jdk-versions:
    description: "Comma-separated list of JDK versions and distributions (supported ones: \"8-zulu\", \"8-temurin\", \"11-temurin\", \"17-temurin\", \"21-temurin\", and \"25-temurin\")"
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7

    - name: Set up JDKs
      uses: huanshankeji/.github/actions/setup-javas@v0.5.2
      with:
        jdk-versions: ${{ inputs.jdk-versions }}

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v6
